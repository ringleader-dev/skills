# The credential story for this manifest set. SHIPPED INERT, ON PURPOSE.
#
# Everything here is commented out, because `.ringleader/` is written into the project repository
# and is meant to be committed — and a token in a committed file is a leaked token. A Secret is
# created from the command line instead, where the value never touches a file:
#
#     rl secret create <app>-git -n <ns> --from-string token=<a GitHub PAT>
#
# Keep this file in the set whether or not the repository is private. For a public repo it is the
# recipe a developer needs the first time they add a private dependency or want to `git push`;
# for a private one it is how anyone else reproduces the clone. See references/credentials.md.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# 1. THE CLONE CREDENTIAL — a Secret, named by the source in workstation-config.yaml.
# ─────────────────────────────────────────────────────────────────────────────────────────────
#
# The Secret must land in the SAME namespace as the Workstation, or it does not resolve. Note
# that `rl apply` does NOT check that a named Secret exists: a config naming a missing one
# applies cleanly and fails six minutes later, in the box, as a clone error.
#
# The URL decides what the Secret must hold, so the two travel together:
#
#     url: https://github.com/<owner>/<repo>.git   →  a TOKEN (a PAT)
#     url: git@github.com:<owner>/<repo>.git       →  an SSH PRIVATE KEY (a deploy key)
#
# Then, in workstation-config.yaml, under `sources[].git`:
#
#     credentialRef:
#       name: <app>-git
#       key: token            # which key of the Secret's data map; omit for a single-key Secret
#
# This file shows the object the command above creates, for reference only. DO NOT fill the value
# in and apply it — `rl secret create` keeps the token out of your working tree.
#
# apiVersion: core.ringleader.dev/v1
# kind: Secret
# metadata:
#   name: <app>-git-${shortHash:creatorUserId}
# spec:
#   data:
#     token: <NEVER WRITE A REAL TOKEN HERE — use `rl secret create`>
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# 2. CREDENTIAL INJECTION — a key for the tools INSIDE the box, which never reaches the box.
# ─────────────────────────────────────────────────────────────────────────────────────────────
#
# Optional, and not applied by this run. Uncomment when a tool in the box has to call an API with
# a key: Ringleader adds the header on the way out, and nothing on the box can read the value.
# The same Secret serves both halves — `${secret:<name>/<key>}` is the string form of the
# `credentialRef` above.
#
# COSTS, before you turn it on: a qemu box RESTARTS once when the first Integration injects into
# it; only the hosts named here are decrypted, and a client with its own pinned trust store will
# refuse the connection.
#
# apiVersion: workstations.ringleader.dev/v1
# kind: Integration
# metadata:
#   name: <app>-github-api-${shortHash:creatorUserId}
# spec:
#   type: httpProxy
#   selector:
#     ownerScope: true                       # your own workstations only
#     matchLabels:
#       app: <app>-${shortHash:creatorUserId}
#   httpProxy:
#     rules:
#       - host: api.github.com
#         inject:
#           header: Authorization
#           value: "Bearer ${secret:<app>-git-${shortHash:creatorUserId}/token}"
#
# ON A CLOUD THIS IS NOT ENOUGH: the key is added on an edge instance, a VM in your cloud account,
# and a namespace administrator declares one Edge per provider and region. Nothing on the
# workstation or the Integration names it — it is matched by provider and region. Without one the
# box reports `EgressEnforced=False`, reason `NoEdge`, and goes without the key.
#
# On qemu, vz and hcs the workstation's own network process adds the key and no Edge is needed.
# On lima the daemon does. On wsl2 injection is not available at all.
#
# apiVersion: core.ringleader.dev/v1
# kind: Edge
# metadata:
#   name: gcp-us-east4
# spec:
#   provider: gcp
#   region: us-east4
#   # aws and azure also need `subnet:` — the subnet cloud onboarding reserved for the edge
#   # instance, published as gateway_subnet_id / GatewaySubnetId / gatewaySubnetId.
